# dsh-tiny-tool bundle patch: inserts the plugin row over the profile root.
#
# The plugin presents base tools under their real name with a trimmed
# description and empty `{}` parameters, then reveals their full schema on
# first call via the `tools/pre-execute` hook (agent-scoped register).

- insert:
  - id: dsh-tiny-tool
    name: 'dsh-tiny-tool'
    config:
      # Tool names to keep fully visible (do not trim descriptions).
      exemptTools: []
      # Tool name prefixes to keep fully visible (e.g. ['mnemon_']).
      exemptPrefixes: []
      # Automatically exclude a set of basic tools from the trim scheme,
      # keeping them fully visible under their real name with full parameters.
      # Default: true. Set false to revert those tools to the trim scheme.
      keepTheBasics: true
